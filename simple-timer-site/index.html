<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Timer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-orbs">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
  </div>

  <div class="container glass">
    <h1><span class="icon">⏱</span> Timer</h1>

    <div class="ring-wrap">
      <svg class="ring-svg" viewBox="0 0 200 200">
        <defs>
          <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#a78bfa"/>
            <stop offset="100%" stop-color="#60a5fa"/>
          </linearGradient>
          <filter id="glow">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <circle class="ring-bg" cx="100" cy="100" r="88"/>
        <circle class="ring-fg" id="ring" cx="100" cy="100" r="88" filter="url(#glow)"/>
      </svg>
      <div class="ring-inner">
        <div class="display" id="display">00:00:00</div>
        <div class="display-label" id="display-label">設定してスタート</div>
      </div>
    </div>

    <div class="input-row">
      <div class="time-input">
        <input type="number" id="hours" min="0" max="99" value="0">
        <label>時間</label>
      </div>
      <div class="colon">:</div>
      <div class="time-input">
        <input type="number" id="minutes" min="0" max="59" value="0">
        <label>分</label>
      </div>
      <div class="colon">:</div>
      <div class="time-input">
        <input type="number" id="seconds" min="0" max="59" value="0">
        <label>秒</label>
      </div>
    </div>

    <div class="buttons">
      <button class="btn btn-reset" id="resetBtn" title="リセット">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
      <button class="btn btn-primary" id="startBtn">
        <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
        <span>スタート</span>
      </button>
      <button class="btn btn-pause hidden" id="pauseBtn">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
        <span>一時停止</span>
      </button>
    </div>
  </div>

  <div id="done-overlay" class="overlay hidden">
    <canvas id="confetti-canvas"></canvas>
    <div class="overlay-box glass">
      <div class="done-pulse"></div>
      <div class="done-icon">✓</div>
      <p class="done-title">完了！</p>
      <p class="done-sub">タイマーが終了しました</p>
      <button class="btn btn-primary" id="closeBtn"><span>閉じる</span></button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
